<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Talkie Preview — illustrative product overview</title>
  <desc id="description">Original vector illustration of a native Mac dictation library and recording overlay. All text, times and entries are synthetic. This is not a screenshot or evidence of successful recording or insertion.</desc>
